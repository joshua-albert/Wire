name: Update the wire

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # plus a manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: wire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull the feeds
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL:  ${{ secrets.SITE_URL }}
          DEEPL_API_KEY:      ${{ secrets.DEEPL_API_KEY }}
          LIBRETRANSLATE_URL: ${{ secrets.LIBRETRANSLATE_URL }}
        run: python wire.py

      - name: Commit the new front page
        run: |
          git config user.name  "the-wire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/ state.json threads.json
          git diff --staged --quiet || git commit -m "wire: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
