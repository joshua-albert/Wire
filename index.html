<meta charset="utf-8">
<title>Field Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Websites and apps by Joshua Scott Albert, Philadelphia.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a quiet white studio index; each project opens as its own case-study view (#slug) with a screenshot gallery and a lightbox. */
:root{
  --bg:#FFFFFF; --panel:#F3F3F4; --panel-2:#F8F8F9; --ink:#0B0B0C; --ink-2:#55565C; --ink-3:#6E6F75;
  --line:#E6E6E9; --line-2:#D9D9DD; --accent:#FF4F1A; --live:#1F9D55; --wip:#C98A00; --frame:#0B0B0C;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --max:1200px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0D0F; --panel:#18181B; --panel-2:#141417; --ink:#F2F2F3; --ink-2:#A9AAB0; --ink-3:#8C8D93;
  --line:#26262A; --line-2:#323238; --accent:#FF6A3D; --live:#3CC57A; --wip:#E3AE2B; --frame:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0D0F; --panel:#18181B; --panel-2:#141417; --ink:#F2F2F3; --ink-2:#A9AAB0; --ink-3:#8C8D93;
  --line:#26262A; --line-2:#323238; --accent:#FF6A3D; --live:#3CC57A; --wip:#E3AE2B; --frame:#000000; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.mono{font-family:var(--mono);font-size:13px;color:var(--ink-3);letter-spacing:.01em}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{min-height:64px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 24px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-height:44px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:block}
nav.main{display:flex;flex-wrap:wrap;gap:2px 22px;font-size:15px}
nav.main a{color:var(--ink-2);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
nav.main a:hover{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.line{border-color:var(--line-2);color:var(--ink);background:transparent}
.btn:hover{opacity:.88}

/* home hero */
.hero{padding-block:clamp(56px,10vw,132px) clamp(48px,7vw,88px)}
.hero h1{font-size:clamp(42px,7vw,92px);line-height:.98;letter-spacing:-.045em;max-width:13ch;margin-top:26px}
.hero .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:28px 48px;margin-top:clamp(28px,4vw,48px)}
.hero p{margin:0;font-size:clamp(18px,1.6vw,21px);line-height:1.45;color:var(--ink-2);max-width:44ch}
.ctas{display:flex;flex-wrap:wrap;gap:10px}

/* section heads */
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:1px solid var(--line);padding-top:18px;margin-bottom:32px}
.shead h2{font-size:15px;font-weight:500}

/* shot frames */
.shot{position:relative;background:var(--panel);border-radius:18px;overflow:hidden;aspect-ratio:16/11;max-width:100%}
.shot.wide{aspect-ratio:16/9}
.desk{position:absolute;left:7%;top:9%;width:86%;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.05),0 24px 60px -20px rgba(0,0,0,.32)}
.desk .bar{height:22px;background:#FBFBFB;border-bottom:1px solid #ECECEE;display:flex;align-items:center;gap:6px;padding:0 10px}
.desk .bar i{width:7px;height:7px;border-radius:50%;background:#D9D9DC;display:block}
.phone{position:absolute;right:6%;bottom:-14%;width:22%;border-radius:24px;border:5px solid var(--frame);overflow:hidden;background:var(--frame);box-shadow:0 30px 60px -18px rgba(0,0,0,.4)}
.shot.wide .phone{width:15%;right:8%}
.phone img{border-radius:19px}
.duo{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;gap:6%;padding-top:6%}
.duo .phone{position:relative;right:auto;bottom:auto;width:20%}
.duo .phone+.phone{margin-top:5%}
.shot.dark{background:#111317}

/* work grid */
.card{display:block;text-decoration:none;color:inherit}
.card:hover .shot{transform:translateY(-2px)}
.card .shot{transition:transform .25s ease}
.meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:baseline;padding-top:18px}
.meta h3{font-size:22px;letter-spacing:-.02em}
.card.big .meta h3{font-size:clamp(22px,2.2vw,28px)}
.meta p{margin:0;grid-column:1/-1;color:var(--ink-2);max-width:60ch}
.more{grid-column:1/-1;font-size:14px;font-weight:500;color:var(--ink);display:inline-flex;gap:6px;align-items:center;margin-top:4px}
.status{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;display:block}
.s-live i{background:var(--live)} .s-wip i{background:var(--wip)} .s-snap i{background:var(--ink-3)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:88px 28px}
.stack{display:grid;gap:96px}

/* approach */
.band{background:var(--panel-2);border-block:1px solid var(--line)}
.band .wrap{padding-block:clamp(72px,10vw,120px)}
.band h2.big{font-size:clamp(32px,4.4vw,56px);line-height:1.05;letter-spacing:-.035em;max-width:18ch;margin-bottom:clamp(40px,5vw,64px)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.step{border-top:1px solid var(--line-2);padding-top:20px;display:grid;gap:10px;align-content:start}
.step h3{font-size:20px;letter-spacing:-.015em}
.step p{margin:0;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(48px,6vw,72px)}
.chips span{border:1px solid var(--line-2);border-radius:999px;padding:9px 16px;font-size:15px;background:var(--bg)}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;align-items:start}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;padding:18px 0;border-top:1px solid var(--line)}
.lrow:last-child{border-bottom:1px solid var(--line)}
.lrow b{font-weight:500;font-size:17px}
.lrow span:last-child{grid-column:1/-1;color:var(--ink-2);font-size:15px}
a.lrow{text-decoration:none}
a.lrow:hover b{text-decoration:underline;text-underline-offset:3px}

/* contact */
.contact{background:var(--ink);color:var(--bg)}
.contact .wrap{padding-block:clamp(80px,11vw,140px) 40px}
.contact h2{font-size:clamp(42px,7vw,88px);line-height:.98;letter-spacing:-.045em;max-width:14ch}
.contact p{color:color-mix(in srgb,var(--bg) 62%,var(--ink));font-size:clamp(18px,1.6vw,21px);max-width:44ch;margin:24px 0 0}
.contact .btn.dark{background:var(--bg);color:var(--ink)}
.contact .addr{font-family:var(--mono);font-size:15px;user-select:all;border:1px solid color-mix(in srgb,var(--bg) 25%,var(--ink));border-radius:999px;padding:12px 18px;display:inline-block}
.contact footer{margin-top:clamp(72px,9vw,120px);border-top:1px solid color-mix(in srgb,var(--bg) 18%,var(--ink));padding-top:20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;font-family:var(--mono);font-size:13px;color:color-mix(in srgb,var(--bg) 55%,var(--ink))}

/* case study */
.case{padding-block:28px 0}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:var(--ink-2);font-size:15px}
.back:hover{color:var(--ink)}
.case h1{font-size:clamp(40px,6.4vw,84px);line-height:1;letter-spacing:-.045em;margin-top:28px}
.case .lede{font-size:clamp(19px,1.8vw,23px);line-height:1.45;color:var(--ink-2);max-width:46ch;margin:22px 0 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin:clamp(36px,5vw,56px) 0}
.facts div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 18px;display:grid;gap:6px;align-content:start;min-width:0}
.facts dt{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.facts dd{margin:0;font-size:16px;font-weight:500;overflow-wrap:anywhere}
.facts dd a{text-decoration:underline;text-underline-offset:3px}
.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:clamp(32px,6vw,96px);margin-top:clamp(64px,8vw,104px)}
.body h2{font-size:15px;font-weight:500;border-top:1px solid var(--line);padding-top:16px}
.prose{display:grid;gap:40px}
.prose section{display:grid;gap:14px}
.prose h3{font-size:22px;letter-spacing:-.02em}
.prose p{margin:0;color:var(--ink-2);max-width:62ch}
.prose ul{margin:0;padding:0;list-style:none;display:grid;gap:0}
.prose li{padding:12px 0;border-top:1px solid var(--line);color:var(--ink-2)}
.prose li b{color:var(--ink);font-weight:500}
.rounds{list-style:none;margin:0;padding:0;display:grid}
.rounds li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.rounds .when{font-family:var(--mono);font-size:13px;color:var(--ink-3);padding-top:2px}
.rounds b{font-weight:500;color:var(--ink);display:block}
.rounds span{color:var(--ink-2)}
.note{font-family:var(--mono);font-size:13px;color:var(--ink-3);margin:0}
.gallery{margin-top:clamp(64px,8vw,104px)}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.gal.ph{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.thumb{all:unset;cursor:zoom-in;display:block;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line);min-width:0}
.thumb img{width:100%}
.thumb.p{border-radius:20px;border:4px solid var(--frame)}
.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cap{font-size:14px;color:var(--ink-3);margin-top:8px}
.next{display:block;text-decoration:none;border-top:1px solid var(--line);margin-top:clamp(80px,10vw,128px)}
.next .wrap{padding-block:40px 64px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.next h2{font-size:clamp(32px,5vw,64px);letter-spacing:-.04em;line-height:1}
.next:hover h2{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,10,12,.92);display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:min(100%,1500px);max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:10px}
.lb .x,.lb .nav{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer;display:grid;place-items:center;font-family:inherit}
.lb .x{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.lb .prev{left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb .nxt{right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.lb .lbcap{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#D9D9DC;font-size:14px;padding:0 72px}

@media (max-width:820px){
  .g2,.g3,.lab,.body{grid-template-columns:minmax(0,1fr)}
  .g2{gap:64px}
  .shot,.shot.wide{aspect-ratio:4/3.4}
  .desk{left:6%;width:88%;top:8%}
  .phone,.shot.wide .phone{width:30%;right:5%;bottom:-10%;border-width:4px;border-radius:18px}
  .phone img{border-radius:14px}
  .duo{padding-top:8%;gap:5%}
  .duo .phone{width:36%}
  .meta{grid-template-columns:minmax(0,1fr)}
  .gal{grid-template-columns:minmax(0,1fr)}
  .gal.ph{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rounds li{grid-template-columns:minmax(0,1fr);gap:4px}
  .lb .nav{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card .shot{transition:none}}
</style>

{ slug:"wedding", name:"Anna & Joshua", kind:"Wedding website", status:["live","Live"],

  blurb:"Three events, one weekend, about 150 guests on their phones. Schedule, hotels, food, things to do and RSVP, with a disco ball you can spin.",

  facts:[["Built for","About 150 guests"],["Built","Sep 27 to Nov 4, 2026"],["Rounds","5 design directions, 32 updates"],["Status","Live"],["Site",'<a href="https://annaandjoshuasayido.com" target="_blank" rel="noopener">annaandjoshuasayido.com</a>']],

  hero:{d:"cowdog-d",m:"cowdog-m"},
  blurb:"A hand-built site for a family photographer. Local search, clear pricing, and mini sessions you can book in a minute.",
  lede:"A family and engagement photography site, rebuilt by hand to get found on Google and get booked.",
  facts:[["Built for","Philly families and engaged couples"],["Built","Aug 11 to Oct 28, 2026"],["Rounds","Teardown, rebuild, 2 audits, 65 updates"],["Status","Live"],["Site",'<a href="https://www.cowdog.studio" target="_blank" rel="noopener">cowdog.studio</a>']],

{ slug:"water", name:"The Water Monitor", kind:"Data journalism", status:["wip","In development"],
  hero:{d:"water-d",m:"water-m",wide:true},

const img=n=>`img/${n}.jpg`;

const status=s=>`<span class="mono status s-${s[0]}"><i aria-hidden="true"></i>${s[1]}</span>`;
function frame(p){
  const h=p.hero;
  if(h.duo) return `<div class="shot wide"><div class="duo">${h.duo.map(n=>`<div class="phone"><img src="${img(n)}" alt="${esc(p.name)} on a phone"></div>`).join("")}</div></div>`;
  return `<div class="shot${h.wide?" wide":""}"><div class="desk"><div class="bar"><i></i><i></i><i></i></div><img src="${img(h.d)}" alt="${esc(p.name)}, main screen"></div>${h.m?`<div class="phone"><img src="${img(h.m)}" alt="${esc(p.name)} on a phone"></div>`:""}</div>`;
}
function card(p,big){
  return `<a class="card${big?" big":""}" href="#${p.slug}">${frame(p)}<div class="meta"><h3>${esc(p.name)}</h3><span class="mono">${esc(p.kind)} · ${status(p.status)}</span><p>${esc(p.blurb)}</p><span class="more">See how it was built <span aria-hidden="true">→</span></span></div></a>`;
}

  return `

  <a class="back" href="#work"><span aria-hidden="true">←</span> All work</a>
  <p class="mono" style="margin-top:20px">${esc(p.kind)} · ${status(p.status)}</p>
  <h1>${esc(p.name)}</h1>
  <p class="lede">${esc(p.lede)}</p>
  <dl class="facts">${p.facts.map(f=>`<div><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join("")}</dl>
  ${frame(p)}
  ${p.link?`<p style="margin-top:22px"><a class="btn line" href="${p.link[1]}" target="_blank" rel="noopener">${p.link[0]} <span aria-hidden="true">↗</span></a></p>`:""}

    <div class="prose"><section><p>${esc(p.how)}</p></section></div>

    <div class="prose"><section><ol class="rounds">${p.rounds.map(r=>`<li><span class="when">${esc(r[0])}</span><div><b>${esc(r[1])}</b><span>${esc(r[2])}</span></div></li>`).join("")}</ol></section></div>
  </div>
  <section class="gallery">
    <div class="shead"><h2>Screens</h2><span class="mono">${GAL.length} screens · tap to enlarge</span></div>

</article>
<a class="next" href="#${nx.slug}"><div class="wrap"><div><p class="mono" style="margin:0 0 10px">Next project</p><h2>${esc(nx.name)}</h2></div><span aria-hidden="true" style="font-size:clamp(32px,5vw,64px);line-height:1">→</span></div></a>`;
}
const app=document.getElementById("app");
const SECTIONS=["work","approach","lab","contact"];
let lastView=null;
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const p=P.find(x=>x.slug===h);
  closeLB();
  if(p){ if(lastView!==p.slug){app.innerHTML=caseView(p);lastView=p.slug;} window.scrollTo(0,0); document.title=p.name+" · Field Test"; return; }
  if(lastView!=="home"){app.innerHTML=home();lastView="home";}
  document.title="Field Test";
  if(SECTIONS.includes(h)){const el=document.getElementById(h); if(el) requestAnimationFrame(()=>el.scrollIntoView());}
  else window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* lightbox */
const lb=document.getElementById("lb"), lbimg=document.getElementById("lbimg"), lbcap=document.getElementById("lbcap");
let cur=0, opener=null;
function showLB(i){cur=(i+GAL.length)%GAL.length;lbimg.src=img(GAL[cur][0]);lbimg.alt=GAL[cur][1];lbcap.textContent=GAL[cur][1]+"  ·  "+(cur+1)+" of "+GAL.length;}
function openLB(i,btn){opener=btn;showLB(i);lb.hidden=false;document.getElementById("lbx").focus();}
function closeLB(){if(lb.hidden)return;lb.hidden=true;if(opener)opener.focus();}
app.addEventListener("click",e=>{const b=e.target.closest(".thumb");if(b)openLB(+b.dataset.i,b);});
document.getElementById("lbx").onclick=closeLB;
document.getElementById("lbp").onclick=()=>showLB(cur-1);
document.getElementById("lbn").onclick=()=>showLB(cur+1);
lb.addEventListener("click",e=>{if(e.target===lb)closeLB();});
lb.addEventListener("keydown",e=>{if(e.key==="Escape")closeLB();if(e.key==="ArrowRight")showLB(cur+1);if(e.key==="ArrowLeft")showLB(cur-1);});
let tx=null;lb.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)showLB(cur+(d<0?1:-1));tx=null;});
route();
</script>
